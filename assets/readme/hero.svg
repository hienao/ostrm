<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">OStrm — OpenList 媒体目录到 STRM 媒体库</title>
  <desc id="desc">OStrm 将 OpenList 中的影音文件扫描、整理并生成可供媒体服务器使用的 STRM 文件。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D1A"/>
      <stop offset="1" stop-color="#111A33"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <path d="M0 330 C250 280 400 420 650 355 S980 260 1200 315 V420 H0Z"
        fill="#17213D" opacity=".55"/>

  <g id="title-block" transform="translate(64 56)">
    <text x="0" y="0" fill="#8EA3C7" font-size="18" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          letter-spacing="3">OPENLIST MEDIA AUTOMATION</text>

    <text x="0" y="92" fill="#F8FAFC" font-size="76" font-weight="800"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          letter-spacing="-3">OStrm</text>

    <text x="0" y="142" fill="#CBD5E1" font-size="25" font-weight="500"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      把 OpenList 影音目录，变成媒体库可直接使用的 STRM 文件
    </text>

    <g transform="translate(0 188)">
      <rect width="166" height="44" rx="22" fill="#1D4ED8"/>
      <text x="83" y="29" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">自托管 Web 应用</text>
      <rect x="178" width="112" height="44" rx="22" fill="#19233F" stroke="#334467"/>
      <text x="234" y="29" text-anchor="middle" fill="#CBD5E1" font-size="19" font-weight="650"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Docker</text>
      <rect x="302" width="142" height="44" rx="22" fill="#19233F" stroke="#334467"/>
      <text x="373" y="29" text-anchor="middle" fill="#CBD5E1" font-size="19" font-weight="650"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">定时 · 增量</text>
    </g>

    <text x="0" y="292" fill="#7385A8" font-size="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hienao/ostrm  ·  SELF-HOSTED</text>
  </g>

  <g id="project-flow" transform="translate(675 45)">
    <rect width="469" height="330" rx="24" fill="#0C1429" stroke="#263657" stroke-width="2"/>
    <text x="28" y="39" fill="#7589AE" font-size="17" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          letter-spacing="2">MEDIA PATH</text>
    <circle cx="411" cy="33" r="5" fill="#22C55E"/>
    <text x="424" y="39" fill="#9EB0CF" font-size="16"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">READY</text>

    <path d="M60 115 H164 M263 115 H363" stroke="url(#flow)" stroke-width="5"
          stroke-linecap="round"/>
    <path d="M153 106 L166 115 L153 124 M352 106 L365 115 L352 124"
          fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(24 74)">
      <rect width="104" height="82" rx="16" fill="#171D38" stroke="#7C3AED" stroke-width="2"/>
      <ellipse cx="52" cy="24" rx="27" ry="10" fill="#8B5CF6"/>
      <path d="M25 24 V51 C25 57 37 62 52 62 C67 62 79 57 79 51 V24"
            fill="none" stroke="#C4B5FD" stroke-width="3"/>
      <text x="52" y="104" text-anchor="middle" fill="#E2E8F0" font-size="20" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">OpenList</text>
    </g>

    <g transform="translate(177 74)">
      <rect width="104" height="82" rx="16" fill="#101F3B" stroke="#2563EB" stroke-width="2"/>
      <path d="M31 28 H73 M31 41 H63 M31 54 H69" stroke="#93C5FD" stroke-width="5" stroke-linecap="round"/>
      <circle cx="77" cy="54" r="7" fill="#3B82F6"/>
      <text x="52" y="104" text-anchor="middle" fill="#E2E8F0" font-size="20" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">扫描整理</text>
    </g>

    <g transform="translate(376 74)">
      <rect width="68" height="82" rx="14" fill="#102A2B" stroke="#16A34A" stroke-width="2"/>
      <path d="M21 17 H47 L56 26 V65 H21Z" fill="#DCFCE7"/>
      <path d="M47 17 V27 H56" fill="none" stroke="#16A34A" stroke-width="3"/>
      <text x="38" y="50" text-anchor="middle" fill="#166534" font-size="15" font-weight="800"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">STRM</text>
      <text x="34" y="104" text-anchor="middle" fill="#E2E8F0" font-size="20" font-weight="700"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">媒体库</text>
    </g>

    <g transform="translate(24 205)">
      <text x="0" y="0" fill="#7183A5" font-size="17"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SOURCE</text>
      <text x="0" y="32" fill="#C4B5FD" font-size="20"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/Movies/Dune.2021.mkv</text>

      <text x="0" y="75" fill="#7183A5" font-size="17"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OUTPUT</text>
      <text x="0" y="107" fill="#86EFAC" font-size="20"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/Movies/Dune (2021).strm</text>
    </g>
  </g>
</svg>
